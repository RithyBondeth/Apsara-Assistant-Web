name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Gating now that the tree is clean. The react-hooks errors this step
        # used to tolerate are fixed: the hydration gates moved to
        # useSyncExternalStore, so nothing calls setState from an effect body.
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
